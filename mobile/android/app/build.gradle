apply plugin: 'com.android.application'

// Release signing: env vars take priority, then a local keystore.properties (never
// committed), in that order — whichever source is complete wins outright, the two
// are not merged field by field. Neither present -> unsigned release APK, same as
// before this was wired up, so a clone without secrets (including CI) still builds.
// See docs/ANDROID.md for how to generate the keystore and keystore.properties.example
// for the four keys it needs.
def envKeystorePath = System.getenv('ANDROID_KEYSTORE_PATH')
def envKeystorePassword = System.getenv('ANDROID_KEYSTORE_PASSWORD')
def envKeyAlias = System.getenv('ANDROID_KEY_ALIAS')
def envKeyPassword = System.getenv('ANDROID_KEY_PASSWORD')

def releaseSigningProps = null
if (envKeystorePath && envKeystorePassword && envKeyAlias && envKeyPassword) {
    releaseSigningProps = [
        storeFile    : envKeystorePath,
        storePassword: envKeystorePassword,
        keyAlias     : envKeyAlias,
        keyPassword  : envKeyPassword,
    ]
} else {
    def keystorePropertiesFile = rootProject.file('keystore.properties')
    if (keystorePropertiesFile.exists()) {
        def props = new Properties()
        keystorePropertiesFile.withInputStream { props.load(it) }
        if (props.storeFile && props.storePassword && props.keyAlias && props.keyPassword) {
            releaseSigningProps = [
                storeFile    : props.storeFile,
                storePassword: props.storePassword,
                keyAlias     : props.keyAlias,
                keyPassword  : props.keyPassword,
            ]
        }
    }
}

if (releaseSigningProps == null) {
    logger.warn('MeteoRide: no release signing config found (ANDROID_KEYSTORE_* env vars or ' +
        'keystore.properties) — assembleRelease/bundleRelease will produce an UNSIGNED build.')
}

android {
    namespace = "cc.meteoride.app"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "cc.meteoride.app"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 1
        versionName "1.0.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    signingConfigs {
        if (releaseSigningProps != null) {
            release {
                storeFile file(releaseSigningProps.storeFile)
                storePassword releaseSigningProps.storePassword
                keyAlias releaseSigningProps.keyAlias
                keyPassword releaseSigningProps.keyPassword
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            if (releaseSigningProps != null) {
                signingConfig signingConfigs.release
            }
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
		dirs '../../node_modules/@capacitor/background-runner/android/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
